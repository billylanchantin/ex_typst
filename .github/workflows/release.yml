name: Build precompiled NIFs

on:
  push:
    branches:
      - main
      - rustler-precompiled
    tags:
      - "*"

jobs:
  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.15", "2.16"]
        job:
          - { os: macos-12, target: aarch64-apple-darwin }
          - { os: macos-12, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: aarch64-unknown-linux-gnu, use-cross: true }
          - { os: ubuntu-24.04, target: aarch64-unknown-linux-musl, use-cross: true }
          - { os: ubuntu-24.04, target: arm-unknown-linux-gnueabihf, use-cross: true }
          - { os: ubuntu-24.04, target: riscv64gc-unknown-linux-gnu, use-cross: true }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, use-cross: true }
          - { os: windows-2025, target: x86_64-pc-windows-gnu }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Extract project version
        shell: bash
        run: |
          # Get the project version from mix.exs
          echo "PROJECT_VERSION=$(sed -n 's/^  @version "\(.*\)"/\1/p' mix.exs | head -n1)" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.job.target }}

      - name: Build the project
        id: build-crate
        uses: philss/rustler-precompiled-action@v1.0.1
        with:
          project-name: example
          project-version: ${{ env.PROJECT_VERSION }}
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          use-cross: ${{ matrix.job.use-cross }}
          project-dir: "native/example"

      - name: Artifact upload
        uses: actions/upload-artifact@v3
        with:
          name: ${{ steps.build-crate.outputs.file-name }}
          path: ${{ steps.build-crate.outputs.file-path }}

      - name: Publish archives and packages
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.build-crate.outputs.file-path }}
        if: startsWith(github.ref, 'refs/tags/')
